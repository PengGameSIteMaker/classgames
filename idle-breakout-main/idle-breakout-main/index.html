    <style>
        :root {
            --night: #10131b;
            --panel: #1b202b;
            --line: #333b4b;
            --text: #f4f1e8;
            --muted: #a9b0bf;
            --gold: #ffc857;
        }

        :root[data-theme="light"] {
            --night: #edf3f8;
            --panel: #f8fafc;
            --line: #d9e1ea;
            --text: #1c2330;
            --muted: #586877;
            --gold: #d39a00;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: block;
            background: radial-gradient(circle at 50% 0%, rgba(255, 200, 87, 0.12), transparent 34rem), var(--night);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .topbar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 15px 10px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(27, 32, 43, 0.92);
            color: var(--muted);
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: color 0.18s ease, border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
            background: #252c39;
            color: var(--text);
        }

        .back-button:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        .game-stage {
            position: relative;
            z-index: 1;
            width: fit-content;
            margin: 0 auto;
            display: block;
            padding: clamp(8px, 2vw, 22px);
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(27, 32, 43, 0.78);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35), inset 0 1px rgba(255, 255, 255, 0.04);
            overflow: visible;
        }

        #gm4html5,
        #gm4html5_div_id {
            position: relative;
            width: 1024px;
            height: 768px;
            margin: 0 auto;
            display: block;
            background: #000;
            border-radius: 10px;
            overflow: visible;
        }

        #gm4html5_div_id:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border-radius: 0;
        }

        canvas {
            position: relative;
            left: 0;
            top: 0;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            background: #000;
            pointer-events: auto;
            margin: 0;
        }

        .game-stage:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: #000;
        }

        .game-stage:fullscreen .game-canvas {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border-radius: 0;
        }

        body.fullscreen-mode {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body.fullscreen-mode .topbar {
            display: none;
        }

        .fullscreen-button {
            position: absolute;
            right: clamp(14px, 2vw, 28px);
            bottom: clamp(14px, 2vw, 28px);
            z-index: 9999;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 13px;
            background: rgba(27, 32, 43, 0.92);
            color: var(--muted);
            font: 650 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: color 0.18s ease, border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
            touch-action: manipulation;
        }

        #fps-counter {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 8px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 12px;
            z-index: 1000;
            pointer-events: none;
        }

        .fullscreen-button:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
            background: #252c39;
            color: var(--text);
        }

        .fullscreen-button:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px 12px 16px;
                overflow: auto;
            }

            .topbar {
                top: 12px;
                left: 12px;
            }

            .back-button {
                font-size: 12px;
                padding: 8px 12px;
            }

            .game-stage {
                padding: 6px;
                border-radius: 12px;
            }

            .fullscreen-button {
                right: 12px;
                bottom: 12px;
                padding: 9px 12px;
                font-size: 12px;
            }
        }

        iframe[id^="google_ads_iframe"],
        [class*="adsbygoogle"],
        [id*="ad"],
        [class*="ad-"],
        [class*="advert"],
        [class*="sponsor"],
        .ads,
        .ad,
        .sponsor {
            display: none !important;
        }
    </style>

<body>
    <div class="topbar">
        <a class="back-button" href="../../games.html" aria-label="Back to Game Room">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            Back to Game Room
        </a>
    </div>

    <main class="game-stage" id="gameStage">
        <div class="gm4html5" id="gm4html5_div_id">
            <canvas id="canvas" width="1024" height="768">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
            <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
        </div>
    </main>
    <div id="fps-counter">FPS: --</div>

    <script type="text/javascript" src="html5game/Coding_BreakOut1.js"></script>

    <script>
        const adSelectors = [
            'iframe[id^="google_ads_iframe"]',
            '[class*="adsbygoogle"]',
            '[id*="ad"]',
            '[class*="ad-"]',
            '[class*="advert"]',
            '[class*="sponsor"]',
            '.ads',
            '.ad',
            '.sponsor'
        ];

        function removeInjectedAds() {
            adSelectors.forEach(selector => {
                document.querySelectorAll(selector).forEach(node => node.remove());
            });
        }

        document.addEventListener('DOMContentLoaded', removeInjectedAds);
        window.addEventListener('load', removeInjectedAds);
        removeInjectedAds();

        const gameStage = document.getElementById('gameStage');
        const fullscreenTarget = document.getElementById('gm4html5_div_id') || document.getElementById('gm4html5') || gameStage;
        const gameCanvas = document.getElementById('canvas');
        const fullscreenButton = document.getElementById('fullscreen-button');
        const fpsCounter = document.getElementById('fps-counter');

        function isFullscreenActive() {
            return document.fullscreenElement === fullscreenTarget ||
                document.webkitFullscreenElement === fullscreenTarget ||
                document.mozFullScreenElement === fullscreenTarget;
        }

        function updateFullscreenButton() {
            const active = isFullscreenActive();
            document.body.classList.toggle('fullscreen-mode', active);
            if (fullscreenButton) {
                fullscreenButton.textContent = active ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
                fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
            }
        }

        function toggleFullscreen() {
            if (!fullscreenTarget) return;
            if (isFullscreenActive()) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitCancelFullScreen) {
                    document.webkitCancelFullScreen();
                }
            } else if (fullscreenTarget.requestFullscreen) {
                if (typeof _Zu2 === 'function') _Zu2();
                fullscreenTarget.requestFullscreen().catch(() => {});
            } else if (gameCanvas && gameCanvas.webkitRequestFullScreen) {
                if (typeof _Zu2 === 'function') _Zu2();
                gameCanvas.webkitRequestFullScreen();
            }
        }

        if (fullscreenButton) {
            fullscreenButton.addEventListener('click', toggleFullscreen);
        }

        document.addEventListener('fullscreenchange', () => {
            if (typeof _pe2 !== 'undefined') _pe2 = true;
            updateFullscreenButton();
        });
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        updateFullscreenButton();

        let lastFrameTime = performance.now();
        let frameCount = 0;

        function frameLoop() {
            const now = performance.now();
            frameCount++;
            if (now - lastFrameTime >= 1000) {
                if (fpsCounter) {
                    fpsCounter.textContent = `FPS: ${Math.round(frameCount / ((now - lastFrameTime) / 1000))}`;
                }
                frameCount = 0;
                lastFrameTime = now;
            }
            requestAnimationFrame(frameLoop);
        }

        requestAnimationFrame(frameLoop);

        window.onload = function () {
            removeInjectedAds();
            if (typeof GameMaker_Init === 'function') {
                GameMaker_Init();
            }
        };
    </script>
