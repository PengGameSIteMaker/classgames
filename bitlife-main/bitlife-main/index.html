<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12131a">
  <title>BitLife - Life Simulator | Pengu Assist Games</title>
  <link rel="stylesheet" href="style.css">
  <script src="TemplateData/UnityProgress.js" defer></script>
  <script src="Build/UnityLoader.js" defer></script>
  <script src="/site-audio.js" defer></script>
</head>
<body>
  <div class="topbar">
    <a class="back-button" href="../../games.html" aria-label="Back to Game Room">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
      </svg>
      Back to Game Room
    </a>
  </div>
  <main class="game-stage" id="gameStage">
    <div class="game-shell">
      <div class="webgl-content" id="gameContainer" aria-label="BitLife game">
        <p class="loading-label" id="loadingLabel" role="status">Loading BitLife…</p>
      </div>
      <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
      <p class="game-message" id="gameMessage" role="status" aria-live="polite"></p>
    </div>
  </main>
  <div id="fps-counter" aria-live="off">FPS: --</div>
  <script>
    const loadingLabel = document.getElementById('loadingLabel');
    const fullscreenButton = document.getElementById('fullscreen-button');
    const gameStage = document.getElementById('gameStage');
    const fpsCounter = document.getElementById('fps-counter');
    const gameMessage = document.getElementById('gameMessage');

    function onUnityProgress(instance, progress) {
      UnityProgress(instance, progress);
      if (progress >= 1) loadingLabel.hidden = true;
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement === gameStage) {
          await document.exitFullscreen();
        } else {
          await gameStage.requestFullscreen();
        }
      } catch {
        gameMessage.textContent = 'Fullscreen is unavailable in this browser.';
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const active = document.fullscreenElement === gameStage;
      document.body.classList.toggle('fullscreen-mode', active);
      fullscreenButton.textContent = active ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
      fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
    });
    fullscreenButton.addEventListener('click', toggleFullscreen);

    window.addEventListener('load', () => {
      if (!window.UnityLoader || typeof window.UnityProgress !== 'function') {
        gameMessage.textContent = 'The game could not load. Please refresh the page and try again.';
        return;
      }
      try {
        UnityLoader.instantiate('gameContainer', 'Build/BitLife.json', { onProgress: onUnityProgress });
      } catch (error) {
        gameMessage.textContent = 'The game could not load. Please refresh the page and try again.';
        console.error('BitLife failed to start:', error);
      }
    });

    let lastFrameTime = performance.now();
    let frames = 0;
    function frameLoop() {
      const now = performance.now();
      frames++;
      if (now - lastFrameTime >= 1000) {
        fpsCounter.textContent = `FPS: ${Math.round(frames / ((now - lastFrameTime) / 1000))}`;
        frames = 0;
        lastFrameTime = now;
      }
      requestAnimationFrame(frameLoop);
    }
    frameLoop();
  </script>
</body>
</html>
