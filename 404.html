<style>

    --forest-deep:#152B24;
    --gold:#C79A3D;
    --paper:#EFEFE9;
    --ink:#20241F;
    --slate:#5E6459;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }

  .wrap{text-align:center; max-width:420px;}

  .penguin{
    width:92px; height:92px; margin:0 auto 22px;
    animation: waddle 2.4s ease-in-out infinite;
  }
  @keyframes waddle{
    0%, 100%{ transform: rotate(-4deg); }
    50%{ transform: rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .penguin{ animation: none; }
  }

  .code{
    font-family:'Source Serif 4',serif; font-weight:600; font-size:72px;
    color:var(--forest); line-height:1; margin-bottom:6px;
  }
  h2{font-size:19px; margin-bottom:10px;}
  p{color:var(--slate); font-size:14.5px; line-height:1.55; margin:0 0 26px;}

  .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .btn-primary{
    background:var(--forest); color:#fff; border:none; border-radius:6px;
    padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer;
    text-decoration:none; display:inline-block;
  }
  .btn-primary:hover{background:var(--forest-deep);}
  .btn-secondary{
    background:none; border:1px solid #DADAD1; color:var(--slate); border-radius:6px;
    padding:10px 18px; font-size:13.5px; cursor:pointer; text-decoration:none; display:inline-block;

  .btn-secondary:hover{background:#fff;}
