<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3D34;
    --forest-deep:#152B24;
    --gold:#C79A3D;
    --paper:#EFEFE9;
    --card:#FFFFFF;
    --line:#DADAD1;
    --ink:#20241F;
    --slate:#5E6459;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  h1,h2{font-family:'Source Serif 4',serif; margin:0; font-weight:600;}

  header{
    background:var(--forest); color:#F1EFE6;
    padding:22px 34px; display:flex; align-items:center; gap:12px;
  }
  header h1{font-size:21px; color:#fff;}
  .back-link{color:var(--gold); text-decoration:none; font-size:13.5px; font-weight:600; margin-left:auto;}

  main{max-width:820px; margin:0 auto; padding:36px 24px 60px;}

  .grid{display:flex; flex-wrap:wrap; gap:26px; justify-content:center;}

  .game-btn{
    background:none; border:none; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    font-family:inherit; text-decoration:none; color:inherit;
  }
  .game-image{
    width:110px; height:110px; border-radius:14px; overflow:hidden;
    display:block; box-shadow:0 3px 10px rgba(31,61,52,0.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .game-image img, .game-image svg{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .game-btn:hover .game-image{transform:translateY(-3px) scale(1.03); box-shadow:0 8px 20px rgba(31,61,52,0.26);}
  .game-btn:focus-visible .game-image{outline:2px solid var(--gold); outline-offset:2px;}
  .game-label{font-size:14px; font-weight:600; color:var(--ink);}

  .status-line{font-size:14.5px; color:var(--slate); margin-bottom:6px; text-align:center;}
</style>
</head>
<body>

<header>
  <h1>Game Room</h1>
  <a class="back-link" href="index.html">← Back to Docket</a>
</header>

<main>
  <div style="text-align:center;">
    <div style="position:relative; max-width:280px; margin:0 auto 18px;">
      <span style="position:absolute; left:10px; top:50%; transform:translateY(-50%); pointer-events:none; display:flex;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="gameSearch" placeholder="Search games…" oninput="filterGames()"
        style="width:100%; padding:9px 12px 9px 30px; border:1px solid var(--line); border-radius:5px; font-size:13.5px; font-family:inherit; background:#fff; display:block;">
    </div>
    <div class="grid" id="gameGrid"></div>
    <div class="status-line" id="gameEmpty" style="display:none;">No games match that search.</div>
  </div>
</main>

<script>
  /* =====================================================================
     TO ADD A NEW GAME:
     1. Build a standalone HTML page for it (copy game-tic-tac-toe.html
        as a starting template — keep its "← Games" link pointing back
        to secret.html).
     2. Add one entry to the GAMES array below — `label`, `keywords`
        (used by search), `file` (the page's filename), and `image`
        (an <img> tag or inline SVG — auto-fits the square button).
     That's it — the selector grid and search box update automatically.
  ===================================================================== */
  const GAMES = [
    {
      label: 'Tic-Tac-Toe',
      keywords: 'tic tac toe classic xs os',
      file: 'game-tic-tac-toe.html',
      image: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect width="100" height="100" rx="14" fill="#1F3D34"/>
        <g stroke="#F1EFE6" stroke-width="4" stroke-linecap="round">
          <line x1="34" y1="14" x2="34" y2="86"/>
          <line x1="66" y1="14" x2="66" y2="86"/>
          <line x1="14" y1="34" x2="86" y2="34"/>
          <line x1="14" y1="66" x2="86" y2="66"/>
        </g>
        <g stroke="#C79A3D" stroke-width="6" stroke-linecap="round">
          <line x1="20" y1="20" x2="30" y2="30"/>
          <line x1="30" y1="20" x2="20" y2="30"/>
        </g>
        <circle cx="50" cy="50" r="7" fill="none" stroke="#F1EFE6" stroke-width="5"/>
      </svg>`
    },
    {
      label: 'Memory Match',
      keywords: 'memory match cards pairs',
      file: 'game-memory-match.html',
      image: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect width="100" height="100" rx="14" fill="#1F3D34"/>
        <rect x="22" y="30" width="30" height="42" rx="5" fill="#F1EFE6" transform="rotate(-8 37 51)"/>
        <rect x="48" y="30" width="30" height="42" rx="5" fill="#C79A3D" transform="rotate(8 63 51)"/>
      </svg>`
    },
    {
      label: 'Rock · Paper · Scissors',
      keywords: 'rock paper scissors',
      file: 'game-rock-paper-scissors.html',
      image: `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect width="100" height="100" rx="14" fill="#1F3D34"/>
        <circle cx="50" cy="50" r="26" fill="#C79A3D"/>
        <text x="50" y="60" font-size="30" text-anchor="middle">✊</text>
      </svg>`
    }
    // Add new game objects here ↑
  ];

  function buildGameGrid(){
    const grid = document.getElementById('gameGrid');
    grid.innerHTML = GAMES.map(g => `
      <a class="game-btn" data-name="${g.keywords}" href="${g.file}">
        <span class="game-image">${g.image}</span>
        <span class="game-label">${g.label}</span>
      </a>
    `).join('');
  }

  function filterGames(){
    const q = document.getElementById('gameSearch').value.trim().toLowerCase();
    const cards = document.querySelectorAll('#gameGrid .game-btn');
    let visibleCount = 0;
    cards.forEach(card => {
      const match = card.dataset.name.includes(q);
      card.style.display = match ? 'flex' : 'none';
      if(match) visibleCount++;
    });
    document.getElementById('gameEmpty').style.display = visibleCount === 0 ? 'block' : 'none';
  }

  buildGameGrid();
</script>

</body>
</html>
