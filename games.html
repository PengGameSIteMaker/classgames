<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131A;
    --surface:#1C1E28;
    --surface-line:#30323F;
    --cream:#F2EFE6;
    --slate:#8B8FA3;
    --cyan:#4CC9F0;
    --magenta:#E8558B;
    --amber:#FFC857;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,200,87,0.08), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}

  header{
    display:flex; align-items:center; gap:12px;
    padding:20px 30px;
    border-bottom:1px solid var(--surface-line);
  }
  .back-link{
    color:var(--slate); text-decoration:none; font-size:13.5px; font-weight:500;
    display:flex; align-items:center; gap:6px;
  }
  .back-link:hover{color:var(--cream);}

  .marquee{
    text-align:center;
    padding:56px 24px 20px;
  }
  .marquee h1{
    font-family:'Baloo 2',cursive;
    font-size:clamp(26px, 7vw, 52px);
    font-weight:700;
    margin:0;
    color:var(--cream);
    letter-spacing:.01em;
    white-space:nowrap;
  }
  .bulb-row{
    display:flex; justify-content:center; gap:9px; margin-top:16px;
  }
  .bulb{
    width:7px; height:7px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px 2px rgba(255,200,87,0.55);
    animation:twinkle 2.6s ease-in-out infinite;
  }
  .bulb:nth-child(odd){animation-delay:.4s;}
  .bulb:nth-child(3n){animation-delay:.9s; background:var(--cyan); box-shadow:0 0 8px 2px rgba(76,201,240,0.5);}
  @keyframes twinkle{
    0%, 100%{opacity:.35; transform:scale(0.85);}
    50%{opacity:1; transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .bulb{animation:none; opacity:.85;}
  }

  main{max-width:900px; margin:0 auto; padding:14px 24px 70px;}

  .search-wrap{position:relative; max-width:280px; margin:0 auto 44px;}
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%); pointer-events:none;
  }
  .search-wrap input{
    width:100%; padding:10px 14px 10px 34px;
    background:var(--surface); border:1px solid var(--surface-line); border-radius:8px;
    color:var(--cream); font-family:inherit; font-size:13.5px;
  }
  .search-wrap input::placeholder{color:var(--slate);}
  .search-wrap input:focus{outline:none; border-color:var(--amber);}

  .cabinet-row{display:flex; flex-wrap:wrap; gap:34px; justify-content:center;}

  .cabinet{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    text-decoration:none; width:150px;
  }
  .screen{
    width:150px; height:150px; border-radius:12px;
    background:var(--surface);
    border:1px solid var(--surface-line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .screen svg{width:78%; height:78%;}
  .cabinet[data-accent="cyan"] .screen{box-shadow:inset 0 0 0 1px transparent;}
  .cabinet:hover .screen{transform:translateY(-4px);}
  .cabinet[data-accent="cyan"]:hover .screen{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan), 0 10px 26px rgba(76,201,240,0.22);}
  .cabinet[data-accent="magenta"]:hover .screen{border-color:var(--magenta); box-shadow:0 0 0 1px var(--magenta), 0 10px 26px rgba(232,85,139,0.22);}
  .cabinet[data-accent="amber"]:hover .screen{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 10px 26px rgba(255,200,87,0.22);}
  .cabinet:focus-visible .screen{outline:2px solid var(--amber); outline-offset:3px;}

  .nameplate{
    font-family:'Space Mono',monospace;
    font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--slate);
  }
  .cabinet:hover .nameplate{color:var(--cream);}

  .empty-note{
    text-align:center; color:var(--slate); font-size:13.5px; padding:30px 0;
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Pengu Assist
  </a>
</header>

<div class="marquee">
  <h1>Game Room</h1>
  <div class="bulb-row" aria-hidden="true">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span>
  </div>
</div>

<main>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8FA3" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="gameSearch" placeholder="Search games…" oninput="filterGames()">
  </div>

  <div class="cabinet-row" id="gameGrid"></div>
  <div class="empty-note" id="gameEmpty" style="display:none;">No games match that search.</div>
</main>

<script>
  /* =====================================================================
     TO ADD A NEW GAME:
     1. Build a standalone HTML page for it (copy game-tic-tac-toe.html
        as a starting template — keep its "← Games" link pointing back
        to games.html).
     2. Add one entry to the GAMES array below — `label`, `keywords`
        (used by search), `file` (the page's filename), `accent`
        ('cyan' | 'magenta' | 'amber' — controls the cabinet's glow),
        and `image` (inline SVG, ideally using the accent's color).
     That's it — the cabinet row and search box update automatically.
  ===================================================================== */
  const GAMES = [
    {
      label: 'Tic-Tac-Toe',
      keywords: 'tic tac toe classic xs os',
      file: 'issac/isaac.html',
      accent: 'cyan',
      image: `<svg viewBox="0 0 100 100">
        <g stroke="#4CC9F0" stroke-width="4" stroke-linecap="round">
          <line x1="34" y1="14" x2="34" y2="86"/>
          <line x1="66" y1="14" x2="66" y2="86"/>
          <line x1="14" y1="34" x2="86" y2="34"/>
          <line x1="14" y1="66" x2="86" y2="66"/>
        </g>
        <g stroke="#F2EFE6" stroke-width="6" stroke-linecap="round">
          <line x1="20" y1="20" x2="30" y2="30"/>
          <line x1="30" y1="20" x2="20" y2="30"/>
        </g>
        <circle cx="50" cy="50" r="7" fill="none" stroke="#F2EFE6" stroke-width="5"/>
      </svg>`
    },
    {
      label: 'Memory Match',
      keywords: 'memory match cards pairs',
      file: 'game-memory-match.html',
      accent: 'magenta',
      image: `<svg viewBox="0 0 100 100">
        <rect x="22" y="30" width="30" height="42" rx="5" fill="#F2EFE6" transform="rotate(-8 37 51)"/>
        <rect x="48" y="30" width="30" height="42" rx="5" fill="#E8558B" transform="rotate(8 63 51)"/>
      </svg>`
    },
    {
      label: 'Rock · Paper · Scissors',
      keywords: 'rock paper scissors',
      file: 'game-rock-paper-scissors.html',
      accent: 'amber',
      image: `<svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="30" fill="none" stroke="#FFC857" stroke-width="4"/>
        <text x="50" y="61" font-size="30" text-anchor="middle">✊</text>
      </svg>`
    }
    // Add new game objects here ↑
  ];

  function buildGameGrid(){
    const grid = document.getElementById('gameGrid');
    grid.innerHTML = GAMES.map(g => `
      <a class="cabinet" data-name="${g.keywords}" data-accent="${g.accent}" href="${g.file}">
        <span class="screen">${g.image}</span>
        <span class="nameplate">${g.label}</span>
      </a>
    `).join('');
  }

  function filterGames(){
    const q = document.getElementById('gameSearch').value.trim().toLowerCase();
    const cards = document.querySelectorAll('#gameGrid .cabinet');
    let visibleCount = 0;
    cards.forEach(card => {
      const match = card.dataset.name.includes(q);
      card.style.display = match ? 'flex' : 'none';
      if(match) visibleCount++;
    });
    document.getElementById('gameEmpty').style.display = visibleCount === 0 ? 'block' : 'none';
  }

  buildGameGrid();
</script>

</body>
</html>
