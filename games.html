<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131A;
    --surface:#1C1E28;
    --surface-line:#30323F;
    --cream:#F2EFE6;
    --slate:#8B8FA3;
    --cyan:#4CC9F0;
    --magenta:#E8558B;
    --amber:#FFC857;
  }
  :root[data-theme="light"]{
    --bg:#EDF3F8;
    --surface:#F9FAFC;
    --surface-line:#D7E1EC;
    --cream:#1D2430;
    --slate:#5A6677;
    --cyan:#2E87B6;
    --magenta:#CC4E89;
    --amber:#D39A00;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,200,87,0.08), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}

  header{
    display:flex; align-items:center; gap:12px;
    padding:20px 30px;
    border-bottom:1px solid var(--surface-line);
  }
  .back-link{
    color:var(--slate); text-decoration:none; font-size:13.5px; font-weight:500;
    display:flex; align-items:center; gap:6px;
  }
  .back-link:hover{color:var(--cream);}
  .settings-link{
    margin-left:auto; width:38px; height:38px; display:grid; place-items:center;
    color:var(--slate); border:1px solid var(--surface-line); border-radius:8px; text-decoration:none;
    transition:color .15s ease, border-color .15s ease;
  }
  .settings-link svg{display:block;}
  .settings-link:hover{color:var(--cream); border-color:var(--amber);}
  .settings-link:focus-visible{outline:2px solid var(--amber); outline-offset:3px;}

  .marquee{
    text-align:center;
    padding:56px 24px 20px;
  }
  .marquee h1{
    font-family:'Baloo 2',cursive;
    font-size:clamp(26px, 7vw, 52px);
    font-weight:700;
    margin:0;
    color:var(--cream);
    letter-spacing:.01em;
    white-space:nowrap;
  }
  .bulb-row{
    display:flex; justify-content:center; gap:9px; margin-top:16px;
  }
  .bulb{
    width:7px; height:7px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px 2px rgba(255,200,87,0.55);
    animation:twinkle 2.6s ease-in-out infinite;
  }
  .bulb:nth-child(odd){animation-delay:.4s;}
  .bulb:nth-child(3n){animation-delay:.9s; background:var(--cyan); box-shadow:0 0 8px 2px rgba(76,201,240,0.5);}
  @keyframes twinkle{
    0%, 100%{opacity:.35; transform:scale(0.85);}
    50%{opacity:1; transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .bulb{animation:none; opacity:.85;}
  }
  .reduced-lights .bulb{animation:none; opacity:.85;}

  @media (max-width: 700px){
    .cabinet-row{gap:26px 18px;}
    .cabinet{width:clamp(100px, 27vw, 130px);}
  }

  @media (max-width: 480px){
    .cabinet-row{gap:22px 14px;}
    .cabinet{width:clamp(90px, 38vw, 120px);}
    .nameplate{font-size:10.5px; letter-spacing:.04em;}
  }

  main{max-width:1200px; margin:0 auto; padding:14px 24px 70px;}

  .search-wrap{position:relative; max-width:280px; margin:0 auto 44px;}
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%); pointer-events:none;
  }
  .search-wrap input{
    width:100%; padding:10px 14px 10px 34px;
    background:var(--surface); border:1px solid var(--surface-line); border-radius:8px;
    color:var(--cream); font-family:inherit; font-size:13.5px;
  }
  .search-wrap input::placeholder{color:var(--slate);}
  .search-wrap input:focus{outline:none; border-color:var(--amber);}

  .cabinet-row{
    display:flex; flex-wrap:wrap; gap:32px 24px; justify-content:center;
    align-items:flex-start;
  }

  .daily-pick{
    max-width:440px; margin:0 auto 36px;
    background:var(--surface); border:1px solid var(--amber);
    border-radius:14px; padding:18px 20px;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 0 0 1px rgba(255,200,87,0.15), 0 8px 24px rgba(255,200,87,0.10);
  }
  .daily-pick .screen{width:64px; height:64px; flex-shrink:0;}
  .daily-pick-info{flex:1; min-width:0;}
  .daily-pick-label{
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--amber); margin-bottom:4px;
  }
  .daily-pick-title{
    font-family:'Baloo 2',cursive; font-size:19px; font-weight:700; color:var(--cream);
  }
  .daily-pick a.play-btn{
    background:var(--amber); color:var(--bg); text-decoration:none;
    font-size:12.5px; font-weight:700; padding:8px 16px; border-radius:7px;
    white-space:nowrap; flex-shrink:0;
  }
  .daily-pick a.play-btn:hover{filter:brightness(1.08);}

  .today-badge{
    position:absolute; top:-8px; right:-8px; z-index:2;
    background:var(--amber); color:var(--bg);
    font-family:'Space Mono',monospace; font-size:9px; font-weight:700;
    padding:3px 6px; border-radius:5px; letter-spacing:.03em;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .favorite-btn{
    position:absolute; top:10px; right:10px; z-index:3;
    width:26px; height:26px; display:grid; place-items:center;
    border:1px solid rgba(255,255,255,0.15); border-radius:999px;
    background:rgba(18,19,26,0.7); color:#f2d77e; font-size:15px; line-height:1;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.2);
  }
  .favorite-btn.is-favorite{background:rgba(255,200,87,0.18); border-color:rgba(255,200,87,0.75);}
  .favorite-btn:hover{transform:scale(1.05);}

  .cabinet{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    text-decoration:none; width:clamp(92px, 9vw, 138px); position:relative;
    flex: 0 0 auto;
  }
  .screen{
    width:100%; aspect-ratio:1; border-radius:12px;
    background:var(--surface);
    border:1px solid var(--surface-line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .screen svg{width:78%; height:78%;}
  .screen img{width:100%; height:100%; object-fit:cover; display:block;}
  .screen img.placeholder-image{object-fit:cover; padding:0; filter:invert(1);}
  .screen{position:relative;}
  .cabinet:hover .screen{
    transform:translateY(-4px);
    border-color: var(--glow, var(--amber));
    box-shadow: 0 0 0 1px var(--glow, var(--amber)), 0 10px 26px rgba(var(--glow-rgb, 255,200,87), 0.22);
  }
  .cabinet:focus-visible .screen{outline:2px solid var(--amber); outline-offset:3px;}

  .cabinet.locked{cursor:default;}
  .cabinet.locked .screen{opacity:.35; filter:grayscale(60%);}
  .cabinet.locked:hover .screen{transform:none; border-color:var(--surface-line); box-shadow:none;}
  .lock-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:26px; background:rgba(18,19,26,0.35);
  }
  .cabinet.locked .nameplate{color:var(--amber); opacity:.9;}
  .cabinet.locked:hover .nameplate{color:var(--amber);}

  .nameplate{
    font-family:'Space Mono',monospace;
    font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--slate);
  }
  .cabinet:hover .nameplate{color:var(--cream);}

  .empty-note{
    text-align:center; color:var(--slate); font-size:13.5px; padding:30px 0;
  }

  iframe[id^="google_ads_iframe"],
  [class*="adsbygoogle"],
  [id*="ad"],
  [class*="ad-"],
  [class*="advert"],
  [class*="sponsor"],
  .ads,
  .ad,
  .sponsor {
    display: none !important;
  }
</style>

  /* =====================================================================

     2. Add one entry to the GAMES array below — `label`, `keywords`

        (an image link). Games without artwork use the inverted
        question-mark image automatically.
     That's it — the cabinet row and search box update automatically.

     TO SCHEDULE A GAME'S RELEASE:
     Add a `releaseDate` field, e.g. releaseDate: '2026-10-01'. Until
     that date, the cabinet shows locked with a countdown instead of

  // Deterministic per-day "random" pick: same result for everyone, all day,
  // and it changes at midnight — because it's derived from today's date
  // string rather than Math.random(), which would pick a new game on
  // every single page load instead of once per day.
  function hashString(str){
    let hash = 0;
    for(let i = 0; i < str.length; i++){
      hash = (hash * 31 + str.charCodeAt(i)) | 0;
    }
    return Math.abs(hash);
  }

  function getDailyPick(){
    const available = GAMES.filter(g => !isLocked(g));
    if(available.length === 0) return null;
    const todayStr = new Date().toISOString().slice(0,10); // e.g. "2026-09-16"
    const index = hashString(todayStr) % available.length;
    return available[index];
  }

  function renderDailyPick(){
    const pick = getDailyPick();
    const el = document.getElementById('dailyPick');
    if(!pick || !getGameRoomSettings().showDailyPick){
      el.style.display = 'none';
      return;
    }
    el.className = 'daily-pick';
    el.style.display = 'flex';
    el.innerHTML = `
      <span class="screen">${pick.image}</span>
      <span class="daily-pick-info">
        <div class="daily-pick-label">🎲 Today's pick</div>
        <div class="daily-pick-title">${pick.label}</div>
      </span>
      <a class="play-btn" href="${pick.file}">Play</a>
    `;
  }

  // Picks the glow color for a cabinet straight from its own SVG, instead
  // of requiring a manually-chosen accent per game. It counts fill/stroke
  // colors used in the image, ignores the shared base palette (the cream
  // and dark-forest tones nearly every icon uses for outlines/background),
  // and returns whichever remaining color appears most — that's treated as
  // the game's "main" color. Falls back to amber if nothing distinctive
  // is found (e.g. an icon drawn entirely in the shared base colors).
  const SHARED_BASE_COLORS = new Set(['#F2EFE6', '#1F3D34', '#152B24', '#12131A', '#1C1E28']);

  function hexToRgb(hex){
    const clean = hex.replace('#', '');
    const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
    const num = parseInt(full, 16);
    return `${(num >> 16) & 255},${(num >> 8) & 255},${num & 255}`;
  }

  function extractMainColor(svgString){
    const matches = svgString.match(/(?:fill|stroke)="(#[0-9a-fA-F]{3,6})"/g) || [];
    const counts = {};
    matches.forEach(m => {
      const hex = m.match(/#[0-9a-fA-F]{3,6}/)[0].toUpperCase();
      if(SHARED_BASE_COLORS.has(hex)) return;
      counts[hex] = (counts[hex] || 0) + 1;
    });
    const entries = Object.entries(counts);
    if(entries.length === 0) return '#FFC857'; // fallback: amber
    entries.sort((a, b) => b[1] - a[1]);
    return entries[0][0];
  }

  function daysUntil(dateStr){
    const target = new Date(dateStr + 'T00:00:00');
    const today = new Date(new Date().toISOString().slice(0,10) + 'T00:00:00');
    return Math.ceil((target - today) / (24*60*60*1000));
  }

  function isLocked(game){
    return !!game.releaseDate && daysUntil(game.releaseDate) > 0;
  }

  function releaseLabel(game){
    const days = daysUntil(game.releaseDate);
    const dateStr = new Date(game.releaseDate + 'T00:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric' });
    if(days === 1) return `Coming tomorrow`;
    if(days <= 7) return `Coming in ${days}d · ${dateStr}`;
    return `Coming ${dateStr}`;
  }

  function getFavoriteGames(){
    const settings = getGameRoomSettings();
    return Array.isArray(settings.favoriteGames) ? settings.favoriteGames : [];
  }

  function updateFavoriteGames(nextFavorites){
    const settings = getGameRoomSettings();
    const normalized = Array.from(new Set(nextFavorites.filter(Boolean)));
    settings.favoriteGames = normalized;
    localStorage.setItem('gameRoomSettings', JSON.stringify(settings));
    window.dispatchEvent(new CustomEvent('gameRoomSettingsChanged', { detail: settings }));
    buildGameGrid();
  }

  function toggleFavorite(gameFile, event){
    if(event){ event.preventDefault(); event.stopPropagation(); }
    const game = GAMES.find(item => item.file === gameFile);
    if(game && isLocked(game)) return;
    const favorites = getFavoriteGames();
    const nextFavorites = favorites.includes(gameFile)
      ? favorites.filter(item => item !== gameFile)
      : [...favorites, gameFile];
    updateFavoriteGames(nextFavorites);
  }

  function buildGameGrid(){
    const grid = document.getElementById('gameGrid');
    const dailyPick = getDailyPick();
    const favoriteGames = getFavoriteGames();
    grid.innerHTML = GAMES.map(g => {
      const locked = isLocked(g);
      const tag = locked ? 'div' : 'a';
      const hrefAttr = locked ? '' : `href="${g.file}"`;
      const isToday = getGameRoomSettings().showDailyPick && dailyPick && g.file === dailyPick.file;
      const isFavorite = favoriteGames.includes(g.file);
      const glowColor = extractMainColor(g.image);
      const glowRgb = hexToRgb(glowColor);
      return `
        <${tag} class="cabinet${locked ? ' locked' : ''}" data-name="${g.keywords}" style="--glow:${glowColor}; --glow-rgb:${glowRgb};" ${hrefAttr}>
          ${isToday ? `<span class="today-badge">TODAY</span>` : ''}
          ${locked ? '' : `<button class="favorite-btn ${isFavorite ? 'is-favorite' : ''}" type="button" aria-label="${isFavorite ? 'Remove from favorites' : 'Add to favorites'}" data-game-file="${g.file}" data-favorited="${isFavorite}">${isFavorite ? '★' : '☆'}</button>`}
          <span class="screen">
            ${g.image}
            ${locked ? `<span class="lock-overlay">🔒</span>` : ''}
          </span>
          <span class="nameplate">${locked ? releaseLabel(g) : g.label}</span>
        </${tag}>
      `;
    }).join('');

    grid.querySelectorAll('.favorite-btn').forEach(button => {
      button.addEventListener('click', event => toggleFavorite(button.dataset.gameFile, event));
    });
  }

  function filterGames(allowBetaRedirect = true){
    const q = document.getElementById('gameSearch').value.trim().toLowerCase();
    if(getGameRoomSettings().rememberSearch){
      localStorage.setItem('gameRoomSearch', document.getElementById('gameSearch').value);
    }else{
      localStorage.removeItem('gameRoomSearch');
    }
    if(allowBetaRedirect && q === 'im a beta tester'){
      window.location.href = 'beta.html';
      return;
    }
    const cards = document.querySelectorAll('#gameGrid .cabinet');
    let visibleCount = 0;
    cards.forEach(card => {
      const match = card.dataset.name.includes(q);
      card.style.display = match ? 'flex' : 'none';
      if(match) visibleCount++;
    });
    document.getElementById('gameEmpty').style.display = visibleCount === 0 ? 'block' : 'none';
  }

  function getGameRoomSettings(){
    try{
      return { showDailyPick:true, animateLights:true, rememberSearch:false, muteSite:false, lightMode:false, favoriteGames:[], ...JSON.parse(localStorage.getItem('gameRoomSettings') || '{}') };
    }catch{
      return { showDailyPick:true, animateLights:true, rememberSearch:false, muteSite:false, lightMode:false, favoriteGames:[] };
    }
  }

  const currentSettings = getGameRoomSettings();
  document.documentElement.dataset.theme = currentSettings.lightMode ? 'light' : 'dark';
  if(!currentSettings.animateLights){
    document.documentElement.classList.add('reduced-lights');
  }

  renderDailyPick();
  buildGameGrid();
  if(getGameRoomSettings().rememberSearch){
    document.getElementById('gameSearch').value = localStorage.getItem('gameRoomSearch') || '';
    filterGames(false);
  }
</script>

<script>
  const adSelectors = [
    'iframe[id^="google_ads_iframe"]',
    '[class*="adsbygoogle"]',
    '[id*="ad"]',
    '[class*="ad-"]',
    '[class*="advert"]',
    '[class*="sponsor"]',
    '.ads',
    '.ad',
    '.sponsor'
  ];

  function removeInjectedAds(){
    adSelectors.forEach(selector => {
      document.querySelectorAll(selector).forEach(node => node.remove());
    });
  }

  document.addEventListener('DOMContentLoaded', removeInjectedAds);
  window.addEventListener('load', removeInjectedAds);
  removeInjectedAds();
</script>

<script src="site-audio.js" defer></script>

</body>
