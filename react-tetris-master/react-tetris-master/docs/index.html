<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="renderer" content="webkit">
    <meta name="description" content="Tetris built with React, Redux, and Immutable" />
    <meta name="keywords" content="Tetris,React,Redux,Immutable,JavaScript">
    <meta name="format-detection" content="telephone=no"/>
    <script>;(function(){var w=parseInt(window.screen.width),s=w/640,u=navigator.userAgent.toLowerCase(),m='<meta name="viewport" content="width=640,';if(/android (\d+\.\d+)/.test(u)){if(parseFloat(RegExp.$1)>2.3)m+='minimum-scale='+s+',maximum-scale='+s+',';}else{m+='user-scalable=no,';}m+='target-densitydpi=device-dpi">';document.write(m);}());</script>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <link href="./loader.css" rel="stylesheet" />
    <style>
      :root{--night:#10131b;--line:#333b4b;--text:#f4f1e8;--muted:#a9b0bf;--gold:#ffc857;--bg-shadow:rgba(0,0,0,.35);}
      html,body{height:100%;}
      body{margin:0!important;min-height:100vh;padding:20px!important;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,rgba(255,200,87,.12),transparent 34rem),var(--night)!important;color:var(--text);overflow:hidden;}
      .topbar{position:fixed;top:20px;left:20px;z-index:10;display:flex;}
      .back-button{display:inline-flex;align-items:center;gap:9px;padding:10px 15px 10px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(27,32,43,.92);color:var(--muted);font:650 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.25);}
      .back-button:hover{border-color:var(--gold);background:#252c39;color:var(--text);}
      .game-stage{position:relative;width:min(700px,100%);height:min(1000px,calc(100vh - 40px));display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--line);border-radius:18px;background:rgba(27,32,43,.78);box-shadow:0 24px 70px var(--bg-shadow),inset 0 1px rgba(255,255,255,.04);overflow:hidden;}
      .game-shell{position:relative;width:100%;height:100%;background:#000;border-radius:10px;overflow:hidden;}
      #root{position:relative;width:100%;height:100%;}
      .fullscreen-button{position:absolute;right:14px;bottom:14px;z-index:20;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:rgba(27,32,43,.92);color:var(--muted);font:650 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;}
      .fullscreen-button:hover{border-color:var(--gold);background:#252c39;color:var(--text);}
      #fps-counter{position:fixed;top:10px;right:10px;padding:5px 8px;border-radius:5px;background:rgba(0,0,0,.5);color:#fff;font:12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;z-index:1000;}
      body.fullscreen-mode .topbar,body.fullscreen-mode #fps-counter{display:none;}
      .game-stage:fullscreen{width:100vw;height:100vh;padding:0;border:0;border-radius:0;background:#000;}
      .game-stage:fullscreen .game-shell{width:100vw;height:100vh;border-radius:0;}
      @media(max-width:600px){body{padding:12px!important}.topbar{top:12px;left:12px}.game-stage{height:calc(100vh - 24px);padding:6px;border-radius:12px}.back-button{font-size:12px;padding:8px 12px;}}
    </style>
<link href="css-1.0.1.css" rel="stylesheet"></head>
<body>
<div class="topbar">
    <a class="back-button" href="../../../games.html" aria-label="Back to Game Room">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Back to Game Room
    </a>
</div>
<main class="game-stage" id="gameStage">
<div class="game-shell">
<div id="root">
    <div class="load">
            <div class="loader">Loading...</div>
    </div>
</div>
<button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
</div>
</main>
<div id="fps-counter">FPS: --</div>
<script>
const fullscreenButton = document.getElementById('fullscreen-button');
const fpsCounter = document.getElementById('fps-counter');
const gameStage = document.getElementById('gameStage');
function toggleFullscreen() { if (document.fullscreenElement === gameStage) document.exitFullscreen(); else gameStage.requestFullscreen(); }
document.addEventListener('fullscreenchange', () => { const active = document.fullscreenElement === gameStage; document.body.classList.toggle('fullscreen-mode', active); fullscreenButton.textContent = active ? '⛶ Exit Fullscreen' : '⛶ Fullscreen'; fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen'); });
fullscreenButton.addEventListener('click', toggleFullscreen);
let lastFrameTime = performance.now(); let frames = 0;
function frameLoop() { const now = performance.now(); frames++; if (now - lastFrameTime >= 1000) { fpsCounter.textContent = 'FPS: ' + Math.round(frames / ((now - lastFrameTime) / 1000)); frames = 0; lastFrameTime = now; } requestAnimationFrame(frameLoop); }
frameLoop();
</script>
<script type="text/javascript" src="app-1.0.1.js"></script></body>
</html>
