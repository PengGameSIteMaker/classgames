<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docket — Assignment Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3D34;
    --forest-deep:#152B24;
    --gold:#C79A3D;
    --paper:#EFEFE9;
    --card:#FFFFFF;
    --line:#DADAD1;
    --ink:#20241F;
    --slate:#5E6459;
    --danger:#A8422F;
    --ok:#3D7A4E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  h1,h2,h3{font-family:'Source Serif 4',serif; margin:0; font-weight:600;}
  button{font-family:inherit;}

  header{
    background:var(--forest);
    color:#F1EFE6;
    padding:22px 34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-mark{
    width:30px;height:30px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4',serif; font-weight:600; color:var(--forest-deep);
    border-radius:4px;
    transform:rotate(-4deg);
  }
  .brand h1{font-size:21px; color:#fff;}
  .brand .tag{font-size:12px; color:#B9C4BB; margin-top:1px;}

  .summary-strip{
    display:flex; gap:26px; font-size:13px; color:#CBD5CC;
  }
  .summary-strip strong{color:#fff; font-family:'Source Serif 4',serif; font-size:17px; display:block;}

  main{max-width:980px; margin:0 auto; padding:30px 24px 60px;}

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:22px;
  }
  .controls select, .controls input[type=text]{
    padding:9px 12px; border:1px solid var(--line); border-radius:5px;
    font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .controls .spacer{flex:1;}
  .btn-new{
    background:var(--forest); color:#fff; border:none; border-radius:5px;
    padding:10px 17px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-new:hover{background:var(--forest-deep);}

  .group{margin-bottom:26px;}
  .group-label{
    font-size:12.5px; font-weight:600; letter-spacing:.01em; color:var(--slate);
    margin-bottom:8px; padding-left:2px;
    display:flex; align-items:center; gap:8px;
  }
  .group-label .count{
    background:var(--line); color:var(--slate); border-radius:10px;
    padding:1px 8px; font-size:11.5px;
  }

  .row{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line);
    border-left:4px solid var(--gold);
    border-radius:5px;
    padding:13px 16px;
    margin-bottom:8px;
  }
  .row.overdue{border-left-color:var(--danger);}
  .row.done{opacity:.55;}
  .row.done .r-title{text-decoration:line-through;}

  .r-check{
    width:20px;height:20px;border-radius:5px;border:1.5px solid var(--slate);
    flex-shrink:0; cursor:pointer; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
  }
  .r-check.checked{background:var(--ok); border-color:var(--ok);}

  .r-body{flex:1; min-width:0;}
  .r-title{font-size:14.5px; font-weight:600;}
  .r-meta{font-size:12px; color:var(--slate); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .r-badge{
    background:var(--paper); color:var(--slate); border-radius:10px;
    padding:1px 9px; font-size:11px; font-weight:600; border:1px solid var(--line);
  }
  .r-class-pill{
    background:var(--forest); color:#fff; border-radius:10px;
    padding:1px 9px; font-size:11px; font-weight:600;
  }
  .r-priority{font-size:11px; font-weight:600; text-transform:none;}
  .r-priority.high{color:var(--danger);}
  .r-priority.medium{color:var(--gold);}
  .r-priority.low{color:var(--slate);}

  .r-due{font-size:12.5px; color:var(--slate); white-space:nowrap; text-align:right;}
  .r-due.overdue-text{color:var(--danger); font-weight:600;}

  .r-actions{display:flex; gap:6px;}
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--slate);
    font-size:14px; padding:4px 6px; border-radius:4px;
  }
  .icon-btn:hover{background:var(--paper); color:var(--ink);}

  .empty{
    text-align:center; color:var(--slate); padding:50px 20px; font-size:14px;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(21,43,36,0.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:8px; width:100%; max-width:460px;
    padding:26px 28px; max-height:85vh; overflow-y:auto;
  }
  .modal h2{font-size:19px; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--slate); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:5px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .btn-secondary{background:none; border:1px solid var(--line); border-radius:5px; padding:9px 16px; font-size:13.5px; cursor:pointer; color:var(--slate);}
  .btn-primary{background:var(--forest); color:#fff; border:none; border-radius:5px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .btn-primary:hover{background:var(--forest-deep);}

  .r-title{cursor:pointer;}
  .r-title:hover{text-decoration:underline;}

  .detail-row{display:flex; gap:10px; font-size:13.5px; margin-bottom:10px;}
  .detail-row .k{color:var(--slate); min-width:90px; flex-shrink:0; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.02em; padding-top:2px;}
  .detail-row .v{flex:1;}
  .detail-notes{white-space:pre-wrap; font-size:13.5px; line-height:1.5;}
  .subtask-row{display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line);}
  .subtask-row:first-child{border-top:none;}
  .subtask-row.done .st-text{text-decoration:line-through; color:var(--slate);}
  .st-check{
    width:17px;height:17px;border-radius:4px;border:1.5px solid var(--slate);
    flex-shrink:0; cursor:pointer; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
  }
  .st-check.checked{background:var(--ok); border-color:var(--ok);}
  .st-text{flex:1; font-size:13.5px;}
  .subtask-progress{font-size:12px; color:var(--slate); margin:8px 0 4px;}
  .detail-actions{display:flex; justify-content:space-between; gap:10px; margin-top:20px;}

  @media (max-width: 600px){
    header{padding:18px 18px; flex-direction:column; align-items:flex-start; gap:12px;}
    .row{flex-wrap:wrap;}
    .r-due{margin-left:34px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">D</div>
    <div>
      <h1>Docket</h1>
      <div class="tag">Assignment manager</div>
    </div>
  </div>
  <div class="summary-strip">
    <div><strong id="statOpen">0</strong>open</div>
    <div><strong id="statOverdue">0</strong>overdue</div>
    <div><strong id="statWeek">0</strong>due this week</div>
  </div>
</header>

<main>
  <div class="controls">
    <div style="position:relative;">
      <span style="position:absolute; left:10px; top:50%; transform:translateY(-50%); pointer-events:none; display:flex;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="searchBox" placeholder="Search assignments…" oninput="render()" style="min-width:200px; padding-left:30px;">
    </div>
    <select id="filterClass" onchange="render()"></select>
    <select id="filterStatus" onchange="render()">
      <option value="open">Open</option>
      <option value="unfinished">Unfinished only</option>
      <option value="done">Finished only</option>
      <option value="all">All</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="due">Sort by due date</option>
      <option value="priority">Sort by priority</option>
      <option value="class">Sort by class</option>
    </select>
    <div class="spacer"></div>
    <button class="btn-new" onclick="openForm()">+ New assignment</button>
    <button class="icon-btn" title="Delete all assignments and reset storage" onclick="clearAllData()" style="border:1px solid var(--line); border-radius:5px; padding:9px 12px;">Clear all data</button>
  </div>

  <div id="listArea"></div>
</main>

<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">New assignment</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label for="fTitle">Title</label>
      <input id="fTitle" type="text" placeholder="e.g. Lab report 3">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="fClass">Class</label>
        <input id="fClass" type="text" placeholder="e.g. Chemistry" list="classList">
        <datalist id="classList"></datalist>
      </div>
      <div class="field">
        <label for="fDue">Due date</label>
        <input id="fDue" type="date">
      </div>
    </div>
    <div class="field">
      <label for="fPriority">Priority</label>
      <select id="fPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="fEstTime">Estimated time (optional)</label>
        <input id="fEstTime" type="text" placeholder="e.g. 2 hrs">
      </div>
      <div class="field">
        <label for="fLink">Resource link (optional)</label>
        <input id="fLink" type="text" placeholder="https://…">
      </div>
    </div>
    <div class="field">
      <label for="fNotes">Notes (optional)</label>
      <textarea id="fNotes" placeholder="Any details worth remembering"></textarea>
    </div>
    <div class="field">
      <label for="fSubtasks">Subtasks (optional, one per line)</label>
      <textarea id="fSubtasks" placeholder="Read chapter 4&#10;Outline response&#10;Write draft"></textarea>
    </div>
    <div id="formError" style="display:none; color:var(--danger); font-size:13px; margin-bottom:10px;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeForm()">Cancel</button>
      <button class="btn-primary" onclick="saveAssignment()">Save assignment</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <h2 id="detailTitle"></h2>
    <div style="margin-top:16px;">
      <div class="detail-row"><div class="k">Class</div><div class="v" id="detailClass"></div></div>
      <div class="detail-row"><div class="k">Due</div><div class="v" id="detailDue"></div></div>
      <div class="detail-row"><div class="k">Priority</div><div class="v" id="detailPriority"></div></div>
      <div class="detail-row" id="detailEstTimeRow"><div class="k">Est. time</div><div class="v" id="detailEstTime"></div></div>
      <div class="detail-row" id="detailLinkRow"><div class="k">Link</div><div class="v"><a id="detailLink" href="#" target="_blank" style="color:var(--forest); font-weight:600;"></a></div></div>
      <div class="detail-row" id="detailNotesRow"><div class="k">Notes</div><div class="v detail-notes" id="detailNotes"></div></div>
    </div>
    <div id="detailSubtasksWrap">
      <div class="subtask-progress" id="subtaskProgress"></div>
      <div id="subtaskList"></div>
    </div>
    <div class="detail-actions">
      <button class="btn-secondary" onclick="closeModal('detailOverlay')">Close</button>
      <div style="display:flex; gap:10px;">
        <button class="btn-secondary" id="detailDeleteBtn" style="color:var(--danger); border-color:var(--danger);">Delete</button>
        <button class="btn-secondary" id="detailEditBtn">Edit</button>
        <button class="btn-primary" id="detailDoneBtn"></button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal" style="max-width:340px; text-align:center;">
    <h2 id="confirmTitle" style="font-size:17px; margin-bottom:10px;">Delete this assignment?</h2>
    <p id="confirmMessage" style="font-size:13.5px; color:var(--slate); margin-bottom:18px;">This can't be undone.</p>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn-secondary" onclick="closeModal('confirmOverlay')">Cancel</button>
      <button class="btn-primary" style="background:var(--danger);" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<script>
  const STORE_KEY = 'docket_assignments_v1';

  let assignments = load();

  function addDays(n){
    const d = new Date();
    d.setDate(d.getDate()+n);
    return d.toISOString().slice(0,10);
  }
  function getCookie(name){
    const match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.$?*|{}()\[\]\\\/+^]/g,'\\$&') + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function setCookie(name, value, days){
    const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
  }
  function load(){
    // Prefer the cookie; some browsers (Chrome especially) silently refuse to
    // set cookies on file:// pages, so fall back to localStorage if the
    // cookie is empty but a localStorage copy exists.
    try{
      const cookieVal = getCookie(STORE_KEY);
      if(cookieVal) return JSON.parse(cookieVal) || [];
      const lsVal = localStorage.getItem(STORE_KEY);
      if(lsVal) return JSON.parse(lsVal) || [];
      return [];
    } catch(e){ return []; }
  }
  function save(){
    const json = JSON.stringify(assignments);
    setCookie(STORE_KEY, json, 365);
    // Verify the cookie actually took (browsers can refuse writes on
    // file:// pages without throwing an error). If it didn't stick,
    // fall back to localStorage so data still persists.
    if(getCookie(STORE_KEY) !== json){
      try{ localStorage.setItem(STORE_KEY, json); } catch(e){ /* ignore */ }
    }
  }

  function fmtDate(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }
  function isOverdue(a){
    return !a.done && a.due < new Date().toISOString().slice(0,10);
  }
  const GRACE_PERIOD_MS = 24 * 60 * 60 * 1000;
  function withinGracePeriod(a){
    return !!(a.done && a.doneAt && (Date.now() - a.doneAt) < GRACE_PERIOD_MS);
  }
  function hoursLeftInGrace(a){
    if(!a.doneAt) return 0;
    const msLeft = GRACE_PERIOD_MS - (Date.now() - a.doneAt);
    return Math.max(0, Math.ceil(msLeft / (60*60*1000)));
  }
  function daysUntil(iso){
    const today = new Date(new Date().toISOString().slice(0,10)+'T00:00:00');
    const d = new Date(iso+'T00:00:00');
    return Math.round((d-today)/86400000);
  }

  function uniqueClasses(){
    return [...new Set(assignments.map(a=>a.cls))].sort();
  }

  function renderFilters(){
    const sel = document.getElementById('filterClass');
    const current = sel.value;
    sel.innerHTML = `<option value="all">All classes</option>` +
      uniqueClasses().map(c=>`<option value="${c}">${c}</option>`).join('');
    if([...sel.options].some(o=>o.value===current)) sel.value = current;

    document.getElementById('classList').innerHTML =
      uniqueClasses().map(c=>`<option value="${c}">`).join('');
  }

  function render(){
    renderFilters();
    const classFilter = document.getElementById('filterClass').value;
    const statusFilter = document.getElementById('filterStatus').value;
    const sortBy = document.getElementById('sortBy').value;
    const query = document.getElementById('searchBox').value.trim().toLowerCase();

    if(query === '55112'){
      window.location.href = 'games.html';
      return;
    }

    let list = assignments.filter(a => {
      if(classFilter !== 'all' && a.cls !== classFilter) return false;
      if(statusFilter === 'open' && a.done && !withinGracePeriod(a)) return false;
      if(statusFilter === 'unfinished' && a.done) return false;
      if(statusFilter === 'done' && !a.done) return false;
      if(query && !(a.title.toLowerCase().includes(query) || a.cls.toLowerCase().includes(query) || (a.notes||'').toLowerCase().includes(query))) return false;
      return true;
    });

    const priorityRank = {high:0, medium:1, low:2};
    list.sort((a,b) => {
      if(sortBy === 'priority') return priorityRank[a.priority]-priorityRank[b.priority] || a.due.localeCompare(b.due);
      if(sortBy === 'class') return a.cls.localeCompare(b.cls) || a.due.localeCompare(b.due);
      return a.due.localeCompare(b.due);
    });

    const area = document.getElementById('listArea');
    if(list.length === 0){
      area.innerHTML = `<div class="empty">Nothing here. Add an assignment or change your filters.</div>`;
    } else {
      area.innerHTML = list.map(a => rowHTML(a)).join('');
    }

    const open = assignments.filter(a=>!a.done);
    document.getElementById('statOpen').textContent = open.length;
    document.getElementById('statOverdue').textContent = open.filter(isOverdue).length;
    document.getElementById('statWeek').textContent = open.filter(a => {
      const du = daysUntil(a.due);
      return du >= 0 && du <= 7;
    }).length;
  }

  function rowHTML(a){
    const overdue = isOverdue(a);
    const subtasks = a.subtasks || [];
    const doneCount = subtasks.filter(s=>s.done).length;
    return `
      <div class="row ${overdue?'overdue':''} ${a.done?'done':''}">
        <div class="r-check ${a.done?'checked':''}" onclick="toggleDone(${a.id})">${a.done?'✓':''}</div>
        <div class="r-body">
          <div class="r-title" onclick="openDetail(${a.id})">${escapeHTML(a.title)}</div>
          <div class="r-meta">
            <span class="r-class-pill">${escapeHTML(a.cls)}</span>
            <span class="r-priority ${a.priority}">${cap(a.priority)} priority</span>
            ${a.estTime ? `<span class="r-badge">⏱ ${escapeHTML(a.estTime)}</span>` : ''}
            ${subtasks.length ? `<span class="r-badge">${doneCount}/${subtasks.length} subtasks</span>` : ''}
            ${a.link ? `<span class="r-badge">🔗 link</span>` : ''}
            ${withinGracePeriod(a) ? `<span class="r-badge">✓ done · clears in ${hoursLeftInGrace(a)}h</span>` : ''}
          </div>
        </div>
        <div class="r-due ${overdue?'overdue-text':''}">${overdue ? 'Overdue · ' : ''}${fmtDate(a.due)}</div>
        <div class="r-actions">
          <button class="icon-btn" title="Edit" onclick="openForm(${a.id})">✎</button>
          <button class="icon-btn" title="Delete" onclick="deleteAssignment(${a.id})">🗑</button>
        </div>
      </div>
    `;
  }

  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function escapeHTML(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function toggleDone(id){
    const a = assignments.find(a=>a.id===id);
    a.done = !a.done;
    a.doneAt = a.done ? Date.now() : null;
    save(); render();
  }

  let pendingConfirmAction = null;

  function openConfirm(title, message, onConfirm){
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    pendingConfirmAction = onConfirm;
    document.getElementById('confirmOverlay').classList.add('show');
  }

  function deleteAssignment(id){
    openConfirm('Delete this assignment?', "This can't be undone.", () => {
      assignments = assignments.filter(a=>a.id!==id);
      save();
      closeModal('detailOverlay');
    });
  }

  function clearAllData(){
    openConfirm('Clear all assignments?', 'This deletes every assignment and resets Docket to empty. This can\'t be undone.', () => {
      assignments = [];
      save();
    });
  }

  document.getElementById('confirmDeleteBtn').onclick = () => {
    if(pendingConfirmAction) pendingConfirmAction();
    pendingConfirmAction = null;
    closeModal('confirmOverlay');
    render();
  };

  function closeModal(id){
    document.getElementById(id).classList.remove('show');
  }

  function openDetail(id){
    const a = assignments.find(a=>a.id===id);
    document.getElementById('detailTitle').textContent = a.title;
    document.getElementById('detailClass').textContent = a.cls;
    document.getElementById('detailDue').textContent = fmtDate(a.due) + (isOverdue(a) ? ' (overdue)' : '');
    document.getElementById('detailPriority').textContent = cap(a.priority);

    const estRow = document.getElementById('detailEstTimeRow');
    if(a.estTime){ estRow.style.display=''; document.getElementById('detailEstTime').textContent = a.estTime; }
    else estRow.style.display = 'none';

    const linkRow = document.getElementById('detailLinkRow');
    if(a.link){ linkRow.style.display=''; const l=document.getElementById('detailLink'); l.href=a.link; l.textContent=a.link; }
    else linkRow.style.display = 'none';

    const notesRow = document.getElementById('detailNotesRow');
    if(a.notes){ notesRow.style.display=''; document.getElementById('detailNotes').textContent = a.notes; }
    else notesRow.style.display = 'none';

    const subtasks = a.subtasks || [];
    const wrap = document.getElementById('detailSubtasksWrap');
    if(subtasks.length){
      wrap.style.display = '';
      const doneCount = subtasks.filter(s=>s.done).length;
      document.getElementById('subtaskProgress').textContent = `Subtasks — ${doneCount}/${subtasks.length} done`;
      document.getElementById('subtaskList').innerHTML = subtasks.map((s,i) => `
        <div class="subtask-row ${s.done?'done':''}">
          <div class="st-check ${s.done?'checked':''}" onclick="toggleSubtask(${a.id},${i})">${s.done?'✓':''}</div>
          <div class="st-text">${escapeHTML(s.text)}</div>
        </div>
      `).join('');
    } else {
      wrap.style.display = 'none';
    }

    document.getElementById('detailEditBtn').onclick = () => { closeModal('detailOverlay'); openForm(a.id); };
    document.getElementById('detailDeleteBtn').onclick = () => {
      deleteAssignment(a.id);
    };
    const doneBtn = document.getElementById('detailDoneBtn');
    doneBtn.textContent = a.done ? 'Mark as not done' : 'Mark as done';
    doneBtn.onclick = () => { toggleDone(a.id); openDetail(a.id); };

    document.getElementById('detailOverlay').classList.add('show');
  }

  function toggleSubtask(assignId, idx){
    const a = assignments.find(a=>a.id===assignId);
    a.subtasks[idx].done = !a.subtasks[idx].done;
    save();
    openDetail(assignId);
    render();
  }

  function openForm(id){
    document.getElementById('formError').style.display = 'none';
    document.getElementById('formTitle').textContent = id ? 'Edit assignment' : 'New assignment';
    document.getElementById('editId').value = id || '';
    if(id){
      const a = assignments.find(a=>a.id===id);
      document.getElementById('fTitle').value = a.title;
      document.getElementById('fClass').value = a.cls;
      document.getElementById('fDue').value = a.due;
      document.getElementById('fPriority').value = a.priority;
      document.getElementById('fEstTime').value = a.estTime || '';
      document.getElementById('fLink').value = a.link || '';
      document.getElementById('fNotes').value = a.notes || '';
      document.getElementById('fSubtasks').value = (a.subtasks || []).map(s=>s.text).join('\n');
    } else {
      document.getElementById('fTitle').value = '';
      document.getElementById('fClass').value = '';
      document.getElementById('fDue').value = new Date().toISOString().slice(0,10);
      document.getElementById('fPriority').value = 'medium';
      document.getElementById('fEstTime').value = '';
      document.getElementById('fLink').value = '';
      document.getElementById('fNotes').value = '';
      document.getElementById('fSubtasks').value = '';
    }
    document.getElementById('formOverlay').classList.add('show');
  }

  function closeForm(){
    document.getElementById('formOverlay').classList.remove('show');
  }

  function saveAssignment(){
    const title = document.getElementById('fTitle').value.trim();
    const cls = document.getElementById('fClass').value.trim();
    const due = document.getElementById('fDue').value;
    const priority = document.getElementById('fPriority').value;
    const estTime = document.getElementById('fEstTime').value.trim();
    let link = document.getElementById('fLink').value.trim();
    if(link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    const notes = document.getElementById('fNotes').value.trim();
    const subtaskLines = document.getElementById('fSubtasks').value.split('\n').map(s=>s.trim()).filter(Boolean);

    if(!title || !cls || !due){
      const err = document.getElementById('formError');
      err.textContent = 'Title, class, and due date are all required.';
      err.style.display = 'block';
      return;
    }

    const editId = document.getElementById('editId').value;
    if(editId){
      const a = assignments.find(a=>a.id===Number(editId));
      // preserve existing done-state of subtasks whose text is unchanged, in order
      const oldSubtasks = a.subtasks || [];
      const subtasks = subtaskLines.map((text,i) => {
        const match = oldSubtasks[i] && oldSubtasks[i].text === text ? oldSubtasks[i] : null;
        return { text, done: match ? match.done : false };
      });
      Object.assign(a, {title, cls, due, priority, estTime, link, notes, subtasks});
    } else {
      const subtasks = subtaskLines.map(text => ({text, done:false}));
      assignments.push({id:Date.now(), title, cls, due, priority, estTime, link, notes, subtasks, done:false});
    }
    save();
    closeForm();
    render();
  }

  render();
</script>

</body>
</html>
