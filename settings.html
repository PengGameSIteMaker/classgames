<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131A;
    --surface:#1C1E28;
    --surface-line:#30323F;
    --cream:#F2EFE6;
    --slate:#8B8FA3;
    --amber:#FFC857;
    --cyan:#4CC9F0;
  }
  :root[data-theme="light"]{
    --bg:#EDF3F8;
    --surface:#F9FAFC;
    --surface-line:#D9E1EA;
    --cream:#1C2330;
    --slate:#586877;
    --amber:#D39A00;
    --cyan:#2E87B6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--cream);
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,200,87,0.08), transparent 60%),var(--bg);
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  header{display:flex; align-items:center; padding:20px 30px; border-bottom:1px solid var(--surface-line);}
  .back-link{display:flex; align-items:center; gap:6px; color:var(--slate); text-decoration:none; font-size:13.5px; font-weight:500;}
  .back-link:hover{color:var(--cream);}
  .marquee{text-align:center; padding:48px 24px 28px;}
  h1{font-family:'Baloo 2',cursive; font-size:42px; line-height:1.15; margin:0;}
  .bulb-row{display:flex; justify-content:center; gap:9px; margin-top:16px;}
  .bulb{
    width:7px; height:7px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 8px 2px rgba(255,200,87,0.55); animation:twinkle 2.6s ease-in-out infinite;
  }
  .bulb:nth-child(odd){animation-delay:.4s;}
  .bulb:nth-child(3n){animation-delay:.9s; background:var(--cyan); box-shadow:0 0 8px 2px rgba(76,201,240,0.5);}
  @keyframes twinkle{0%,100%{opacity:.35; transform:scale(.85);}50%{opacity:1; transform:scale(1);}}
  @media(prefers-reduced-motion:reduce){.bulb{animation:none; opacity:.85;}}
  .reduced-lights .bulb{animation:none; opacity:.85;}
  main{max-width:600px; margin:0 auto; padding:0 24px 64px;}
  .settings-list{overflow:hidden; background:var(--surface); border:1px solid var(--surface-line); border-radius:8px;}
  .setting-row{
    min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:17px 18px; border-bottom:1px solid var(--surface-line); cursor:pointer;
  }
  .setting-row:last-child{border-bottom:0;}
  .setting-label{font-size:15px; font-weight:500;}
  .settings-actions{
    margin-top:24px; display:grid; gap:14px;
  }
  .action-row{
    display:flex; flex-wrap:wrap; gap:10px;
  }
  .action-btn, .action-link{
    appearance:none; border:1px solid var(--surface-line); background:var(--surface); color:var(--cream);
    padding:10px 14px; border-radius:8px; font:600 14px 'Space Grotesk',system-ui,sans-serif;
    cursor:pointer; text-decoration:none;
  }
  .action-btn:hover, .action-link:hover{border-color:var(--amber);}
  .hidden-file-input{display:none;}
  .status-text{min-height:20px; font-size:12px; color:var(--slate);}
  .switch{position:relative; flex-shrink:0; width:44px; height:26px;}
  .switch input{position:absolute; width:1px; height:1px; opacity:0;}
  .switch-track{position:absolute; inset:0; border-radius:20px; background:#393B47; transition:background .15s ease;}
  .switch-track::after{
    content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:var(--cream); transition:transform .15s ease;
  }
  .switch input:checked + .switch-track{background:var(--amber);}
  .switch input:checked + .switch-track::after{transform:translateX(18px); background:var(--bg);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--cream); outline-offset:3px;}
  @media(max-width:480px){
    header{padding:18px;}
    main{padding:48px 20px;}
    h1{font-size:32px;}
  }
</style>
</head>
<body>
<header>
  <a class="back-link" href="games.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Game Room
  </a>
</header>
<div class="marquee">
  <h1>Settings</h1>
  <div class="bulb-row" aria-hidden="true">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span>
  </div>
</div>
<main>
  <div class="settings-list">
    <label class="setting-row" for="showDailyPick">
      <span class="setting-label">Show daily pick</span>
      <span class="switch">
        <input id="showDailyPick" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
      </span>
    </label>
    <label class="setting-row" for="animateLights">
      <span class="setting-label">Animate marquee lights</span>
      <span class="switch">
        <input id="animateLights" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
      </span>
    </label>
    <label class="setting-row" for="rememberSearch">
      <span class="setting-label">Remember search</span>
      <span class="switch">
        <input id="rememberSearch" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
      </span>
    </label>
    <label class="setting-row" for="lightMode">
      <span class="setting-label">Light mode</span>
      <span class="switch">
        <input id="lightMode" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
      </span>
    </label>
    <label class="setting-row" for="muteSite">
      <span class="setting-label">Mute site audio</span>
      <span class="switch">
        <input id="muteSite" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
      </span>
    </label>
  </div>

  <div class="settings-actions">
    <div class="action-row">
      <button type="button" class="action-btn" id="exportSettingsBtn">Download settings</button>
      <button type="button" class="action-btn" id="importSettingsBtn">Import settings file</button>
    </div>
    <input id="settingsFileInput" class="hidden-file-input" type="file" accept="application/json,.json">
    <div id="settingsStatus" class="status-text" aria-live="polite"></div>
  </div>
</main>
<script>
  const DEFAULT_SETTINGS = {
    showDailyPick:true,
    animateLights:true,
    rememberSearch:false,
    muteSite:false,
    lightMode:false,
    favoriteGames:[]
  };

  function readSettings(){
    try{
      const raw = JSON.parse(localStorage.getItem('gameRoomSettings') || '{}');
      return { ...DEFAULT_SETTINGS, ...raw, favoriteGames: Array.isArray(raw.favoriteGames) ? raw.favoriteGames : [] };
    }catch{
      return { ...DEFAULT_SETTINGS };
    }
  }

  function applySettings(settings){
    document.getElementById('showDailyPick').checked = settings.showDailyPick;
    document.getElementById('animateLights').checked = settings.animateLights;
    document.getElementById('rememberSearch').checked = settings.rememberSearch;
    document.getElementById('lightMode').checked = settings.lightMode;
    document.getElementById('muteSite').checked = settings.muteSite;
    document.documentElement.dataset.theme = settings.lightMode ? 'light' : 'dark';
    document.documentElement.classList.toggle('reduced-lights', !settings.animateLights);
  }

  function saveSettings(){
    const existing = readSettings();
    const settings = {
      ...existing,
      showDailyPick:document.getElementById('showDailyPick').checked,
      animateLights:document.getElementById('animateLights').checked,
      rememberSearch:document.getElementById('rememberSearch').checked,
      lightMode:document.getElementById('lightMode').checked,
      muteSite:document.getElementById('muteSite').checked
    };
    localStorage.setItem('gameRoomSettings', JSON.stringify(settings));
    if(!settings.rememberSearch){
      localStorage.removeItem('gameRoomSearch');
    }
    applySettings(settings);
    window.dispatchEvent(new CustomEvent('gameRoomSettingsChanged', { detail: settings }));
    return settings;
  }

  function exportSettings(){
    const settings = saveSettings();
    const payload = JSON.stringify(settings, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'game-room-settings.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    document.getElementById('settingsStatus').textContent = 'Settings exported.';
  }

  function loadSettingsFromText(text){
    if(!text){
      document.getElementById('settingsStatus').textContent = 'No settings data found.';
      return;
    }

    try{
      const parsed = JSON.parse(text);
      const merged = { ...DEFAULT_SETTINGS, ...parsed, favoriteGames: Array.isArray(parsed.favoriteGames) ? parsed.favoriteGames : [] };
      localStorage.setItem('gameRoomSettings', JSON.stringify(merged));
      applySettings(merged);
      window.dispatchEvent(new CustomEvent('gameRoomSettingsChanged', { detail: merged }));
      if(!merged.rememberSearch){
        localStorage.removeItem('gameRoomSearch');
      }
      document.getElementById('settingsStatus').textContent = 'Settings imported successfully.';
      document.getElementById('settingsFileInput').value = '';
    }catch{
      document.getElementById('settingsStatus').textContent = 'That is not valid settings JSON.';
    }
  }

  function importSettings(){
    document.getElementById('settingsFileInput').click();
  }

  function handleSettingsFileImport(event){
    const [file] = event.target.files || [];
    if(!file){ return; }

    const reader = new FileReader();
    reader.onload = () => loadSettingsFromText(String(reader.result || ''));
    reader.onerror = () => {
      document.getElementById('settingsStatus').textContent = 'Unable to read that settings file.';
    };
    reader.readAsText(file);
  }

  applySettings(readSettings());
  document.querySelectorAll('.switch input').forEach(input => input.addEventListener('change', saveSettings));
  document.getElementById('exportSettingsBtn').addEventListener('click', exportSettings);
  document.getElementById('importSettingsBtn').addEventListener('click', importSettings);
  document.getElementById('settingsFileInput').addEventListener('change', handleSettingsFileImport);
</script>
</body>
</html>
