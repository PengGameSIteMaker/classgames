<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>beta</title>
<style>
  /* just enough to keep it readable - not trying to make this look finished */
  body{ max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  h2{ margin-top: 28px; margin-bottom: 4px; }
  ul{ margin-top: 8px; }
  li{ margin-bottom: 4px; }
  hr{ margin: 24px 0; }
</style>
</head>
<body>

<h1>Beta games</h1>
<p>Still a work in progress - nothing here is final.</p>

<hr>

<div id="betaSection"></div>
<div id="unstableSection"></div>

<hr>

<p>TODO: more games, .</p>

<p><a href="games.html">&larr; back to games</a></p>

<script>
  // To move a game between sections, just change its status below:
  //   'beta'     -> shows under "Beta" (mostly working, still testing)
  //   'unstable' -> shows under "Unstable - please test" (rougher, wants eyes on it)
  const BETA_GAMES = [
    { label: '?', file: 'game-connect-four.html', status: 'beta', note: 'Mostly works.' },
    { label: '?', file: 'game-snake.html', status: 'beta', note: 'Needs mobile controls still.' },
    { label: '?', file: 'game-hangman.html', status: 'unstable', note: 'Word list is short - needs more words.' },
  ];

  function renderList(games){
    if(games.length === 0) return '<p><em>Nothing here right now.</em></p>';
    return '<ul>' + games.map(g =>
      `<li><a href="${g.file}">${g.label}</a> - ${g.note}</li>`
    ).join('') + '</ul>';
  }

  document.getElementById('betaSection').innerHTML =
    '<h2>Beta</h2><p>Still being tested - some things might be broken or missing.</p>' +
    renderList(BETA_GAMES.filter(g => g.status === 'beta'));

  document.getElementById('unstableSection').innerHTML =
    '<h2>Unstable - please test</h2><p>Rougher than the games above. Play this and let me know if you find any bugs or something feels off.</p>' +
    renderList(BETA_GAMES.filter(g => g.status === 'unstable'));
</script>

</body>
</html>
