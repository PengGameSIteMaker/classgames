<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Binding of Isaac</title>
  <style>
    :root{--night:#10131b;--panel:#1b202b;--line:#333b4b;--text:#f4f1e8;--muted:#a9b0bf;--gold:#ffc857;}
    *{box-sizing:border-box;}
    html,body{min-height:100%;}
    body{margin:0;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,rgba(255,200,87,.12),transparent 34rem),var(--night);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
    .topbar{position:fixed;top:20px;left:20px;z-index:10;display:flex;gap:8px;}
    .back-button{display:inline-flex;align-items:center;gap:9px;padding:10px 15px 10px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(27,32,43,.92);color:var(--muted);font-size:14px;font-weight:650;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:color .18s ease,border-color .18s ease,transform .18s ease,background .18s ease;}
    .back-button:hover{transform:translateY(-2px);border-color:var(--gold);background:#252c39;color:var(--text);}
    .back-button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
    .game-stage{position:relative;width:min(1500px,100%);margin:auto;display:flex;justify-content:center;align-items:center;padding:clamp(8px,2vw,22px);border:1px solid var(--line);border-radius:18px;background:rgba(27,32,43,.78);box-shadow:0 24px 70px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.04);overflow:hidden;}
    .game-canvas{position:relative;width:100%;aspect-ratio:1500 / 720;display:block;background:#000;border-radius:10px;overflow:hidden;}
    object{display:block;width:100%;height:100%;aspect-ratio:1500 / 720;min-height:240px;background:#000;border-radius:10px;overflow:hidden;}
    embed{width:100%;height:100%;display:block;}
    .game-stage:fullscreen{width:100vw;height:100vh;padding:0;border:0;border-radius:0;background:#000;}
    .game-stage:fullscreen .game-canvas{width:100vw;height:100vh;max-width:none;max-height:none;aspect-ratio:auto;border-radius:0;}
    .game-stage:fullscreen object,.game-stage:fullscreen embed{width:100vw !important;height:100vh !important;max-width:none;max-height:none;min-height:0;border-radius:0;display:block;}
    body.fullscreen-mode{margin:0;padding:0;overflow:hidden;background:#000;}
    body.fullscreen-mode .topbar,body.fullscreen-mode #fps-counter{display:none;}
    .fullscreen-button{position:absolute;right:clamp(14px,2vw,28px);bottom:clamp(14px,2vw,28px);z-index:2;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:rgba(27,32,43,.92);color:var(--muted);font:650 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:color .18s ease,border-color .18s ease,transform .18s ease,background .18s ease;touch-action:manipulation;}
    .fullscreen-button:hover{transform:translateY(-2px);border-color:var(--gold);background:#252c39;color:var(--text);}
    .fullscreen-button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
    #fps-counter{position:fixed;top:10px;right:10px;padding:5px;border-radius:5px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;z-index:1000;}
    @media (max-width:768px){body{padding:12px 12px 16px;overflow:auto;} .topbar{top:12px;left:12px;} .back-button{font-size:12px;padding:8px 12px;} .game-stage{width:100%;padding:6px;border-radius:12px;} .game-canvas{min-height:210px;} object{min-height:180px;border-radius:7px;} .fullscreen-button{right:12px;bottom:12px;padding:9px 12px;font-size:12px;}}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-button" href="../games.html" aria-label="Back to Game Room">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Back to Game Room
    </a>
  </div>
  <main class="game-stage" id="gameStage">
    <div class="game-canvas">
      <object id="gameObject" data="/issac/the-binding.swf" type="application/x-shockwave-flash" width="1500" height="720" allowfullscreen="true" allowscriptaccess="always">
        <embed src="/issac/the-binding.swf" width="1500" height="720" allowfullscreen="true" allowscriptaccess="always">
      </object>
      <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
    </div>
  </main>
  <div id="fps-counter">FPS: --</div>
  <script src="/issac/ruffle.js"></script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    const gameStage = document.getElementById('gameStage');
    const fpsCounter = document.getElementById('fps-counter');
    const fullscreenButton = document.getElementById('fullscreen-button');

    function updateFullscreenButton() {
      const active = document.fullscreenElement === gameStage;
      document.body.classList.toggle('fullscreen-mode', active);
      fullscreenButton.textContent = active ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
      fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
    }

    function toggleFullscreen() {
      if (document.fullscreenElement === gameStage) {
        document.exitFullscreen();
      } else {
        gameStage.requestFullscreen();
      }
    }

    if (fullscreenButton) {
      fullscreenButton.addEventListener('click', toggleFullscreen);
    }

    document.addEventListener('fullscreenchange', updateFullscreenButton);
    updateFullscreenButton();

    let lastFrameTime = performance.now();
    let frames = 0;

    function frameLoop() {
      const now = performance.now();
      frames++;
      if (now - lastFrameTime >= 1000) {
        fpsCounter.textContent = `FPS: ${Math.round(frames / ((now - lastFrameTime) / 1000))}`;
        frames = 0;
        lastFrameTime = now;
      }
      requestAnimationFrame(frameLoop);
    }

    frameLoop();
  </script>
</body>
</html>
