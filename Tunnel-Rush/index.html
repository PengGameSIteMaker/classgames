<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunnel Rush</title>
  <style>
    :root {
      --night: #10131b;
      --panel: #1b202b;
      --line: #333b4b;
      --text: #f4f1e8;
      --muted: #a9b0bf;
      --gold: #ffc857;
      --bg-shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, rgba(255, 200, 87, 0.12), transparent 34rem), var(--night);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 15px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(27, 32, 43, 0.92);
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: color 0.18s ease, border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }

    .back-button:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      background: #252c39;
      color: var(--text);
    }

    .back-button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .game-stage {
      position: relative;
      width: min(1500px, 100%);
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(8px, 2vw, 22px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(27, 32, 43, 0.78);
      box-shadow: 0 24px 70px var(--bg-shadow), inset 0 1px rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .game-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 240px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .webgl-content,
    #gameContainer,
    #unityContainer,
    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .webgl-content {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #gameContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    .game-stage:fullscreen {
      width: 100vw;
      height: 100vh;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    .game-stage:fullscreen .game-shell {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      aspect-ratio: auto;
      border-radius: 0;
    }

    .game-stage:fullscreen #gameContainer,
    .game-stage:fullscreen .webgl-content {
      width: 100vw !important;
      height: 100vh !important;
    }

    .fullscreen-button {
      position: absolute;
      right: clamp(14px, 2vw, 28px);
      bottom: clamp(14px, 2vw, 28px);
      z-index: 2;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 13px;
      background: rgba(27, 32, 43, 0.92);
      color: var(--muted);
      font: 650 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: color 0.18s ease, border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }

    .fullscreen-button:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      background: #252c39;
      color: var(--text);
    }

    .fullscreen-button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    #fps-counter {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 5px 8px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 12px;
      z-index: 1000;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .topbar {
        top: 12px;
        left: 12px;
      }

      .game-stage {
        padding: 6px;
        border-radius: 12px;
      }

      .game-shell {
        min-height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-button" href="../games.html" aria-label="Back to Game Room">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
      </svg>
      Back to Game Room
    </a>
  </div>

  <main class="game-stage" id="gameStage">
    <div class="game-shell">
      <div class="webgl-content">
        <div id="gameContainer"></div>
      </div>
      <button class="fullscreen-button" id="fullscreen-button" type="button" onclick="toggleFullscreen()" aria-label="Enter fullscreen">⛶ Fullscreen</button>
    </div>
  </main>

  <div id="fps-counter">FPS: --</div>

  <script src="UnityLoader2019.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "build.json");

    const gameStage = document.getElementById('gameStage');
    const fullscreenButton = document.getElementById('fullscreen-button');
    const fpsCounter = document.getElementById('fps-counter');

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        gameStage.requestFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const active = document.fullscreenElement === gameStage;
      fullscreenButton.textContent = active ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
      fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
    });

    let lastFrameTime = performance.now();
    let frames = 0;

    function frameLoop() {
      const now = performance.now();
      frames++;

      if (now - lastFrameTime >= 1000) {
        fpsCounter.textContent = `FPS: ${Math.round(frames / ((now - lastFrameTime) / 1000))}`;
        frames = 0;
        lastFrameTime = now;
      }

      requestAnimationFrame(frameLoop);
    }

    frameLoop();
  </script>
</body>
</html>
